[package]
name = "vignette"
version = "0.1.0"
description = "Vignette — post-its dockés au bord de l'écran"
authors = ["Ulrich Rozier"]
edition = "2021"

[lib]
name = "vignette_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-positioner = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
